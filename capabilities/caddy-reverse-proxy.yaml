naftiko: 1.0.0-alpha2
info:
  label: Caddy Admin API — Reverse Proxy
  description: 'Caddy Admin API — Reverse Proxy. 1 operations. Lead operation: Show reverse proxy upstream status. Self-contained
    Naftiko capability covering one Caddy business surface.'
  tags:
  - Caddy
  - Reverse Proxy
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CADDY_API_KEY: CADDY_API_KEY
capability:
  consumes:
  - type: http
    namespace: caddy-reverse-proxy
    baseUri: http://localhost:2019
    description: Caddy Admin API — Reverse Proxy business capability. Self-contained, no shared references.
    resources:
    - name: reverse_proxy-upstreams
      path: /reverse_proxy/upstreams
      operations:
      - name: getreverseproxyupstreams
        method: GET
        description: Show reverse proxy upstream status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: caddy-reverse-proxy-rest
    port: 8080
    description: REST adapter for Caddy Admin API — Reverse Proxy. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/reverse-proxy/upstreams
      name: reverse-proxy-upstreams
      description: REST surface for reverse_proxy-upstreams.
      operations:
      - method: GET
        name: getreverseproxyupstreams
        description: Show reverse proxy upstream status
        call: caddy-reverse-proxy.getreverseproxyupstreams
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: caddy-reverse-proxy-mcp
    port: 9090
    transport: http
    description: MCP adapter for Caddy Admin API — Reverse Proxy. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: show-reverse-proxy-upstream-status
      description: Show reverse proxy upstream status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: caddy-reverse-proxy.getreverseproxyupstreams
      outputParameters:
      - type: object
        mapping: $.

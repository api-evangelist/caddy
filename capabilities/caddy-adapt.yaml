naftiko: 1.0.0-alpha2
info:
  label: Caddy Admin API — Adapt
  description: 'Caddy Admin API — Adapt. 1 operations. Lead operation: Convert a Caddyfile or other config format to JSON
    without loading. Self-contained Naftiko capability covering one Caddy business surface.'
  tags:
  - Caddy
  - Adapt
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CADDY_API_KEY: CADDY_API_KEY
capability:
  consumes:
  - type: http
    namespace: caddy-adapt
    baseUri: http://localhost:2019
    description: Caddy Admin API — Adapt business capability. Self-contained, no shared references.
    resources:
    - name: adapt
      path: /adapt
      operations:
      - name: adaptconfig
        method: POST
        description: Convert a Caddyfile or other config format to JSON without loading
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: caddy-adapt-rest
    port: 8080
    description: REST adapter for Caddy Admin API — Adapt. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/adapt
      name: adapt
      description: REST surface for adapt.
      operations:
      - method: POST
        name: adaptconfig
        description: Convert a Caddyfile or other config format to JSON without loading
        call: caddy-adapt.adaptconfig
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: caddy-adapt-mcp
    port: 9090
    transport: http
    description: MCP adapter for Caddy Admin API — Adapt. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: convert-caddyfile-other-config-format
      description: Convert a Caddyfile or other config format to JSON without loading
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: caddy-adapt.adaptconfig
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

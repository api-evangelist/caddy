aid: caddy
name: Caddy
description: >-
  Caddy is a modern, extensible, open-source web server and reverse proxy written in Go that provides automatic HTTPS
  via Let's Encrypt, a dynamic JSON-based admin API, a human-friendly Caddyfile configuration format, and a modular
  architecture with a rich ecosystem of plugins for authentication, observability, and custom behavior.
